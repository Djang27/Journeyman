<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#efe7d6" />
    <meta
      name="description"
      content="One player, one career. Name every team he played for, in order. A new NBA career puzzle every day, free, no account needed."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Journeyman — the daily NBA career puzzle</title>

    <!--
      The link preview.

      The share grid carries a link now, and a link with no preview is a bare
      URL in somebody's group chat -- the one place where the whole share loop
      is either worth something or isn't. These tags are what Discord, iMessage,
      Slack, WhatsApp, Twitter and Facebook read to turn it into a card.

      og:image is absolute on purpose. Most scrapers will not resolve a relative
      one, and a card with a broken image is worse than no card. That means a
      preview deployment advertises production's image, which is the harmless
      direction of that trade.

      og:url is deliberately absent: fixing it to the production URL makes every
      share of a preview or a future custom domain claim to be this one.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Journeyman" />
    <meta property="og:title" content="Journeyman — the daily NBA career puzzle" />
    <meta
      property="og:description"
      content="One player, one career. Name every team he played for, in order. A new one every day, free, no account needed."
    />
    <meta property="og:image" content="https://journeymannba.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Journeyman — a career, one club at a time." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Journeyman — the daily NBA career puzzle" />
    <meta
      name="twitter:description"
      content="One player, one career. Name every team he played for, in order. A new one every day, free, no account needed."
    />
    <meta name="twitter:image" content="https://journeymannba.vercel.app/og.png" />
    <!--
      Vercel Web Analytics.

      The script rather than the @vercel/analytics package, deliberately: the
      package's peer range wants a newer TypeScript than react-scripts 5 pins,
      so npm refuses the install. Forcing it would mean either --legacy-peer-deps
      or a hand-edited lockfile, and this repo has already lost a day to a
      package-lock that npm regenerated differently. The script is what the
      package injects anyway.

      It is served by Vercel itself, so it is inert in local development and on
      any other host -- no key, no account id, nothing to configure.
    -->
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
