<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#efe7d6" />
    <meta
      name="description"
      content="Journeyman — trace an NBA player's career from team to team, in order."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Journeyman</title>
    <!--
      Vercel Web Analytics.

      The script rather than the @vercel/analytics package, deliberately: the
      package's peer range wants a newer TypeScript than react-scripts 5 pins,
      so npm refuses the install. Forcing it would mean either --legacy-peer-deps
      or a hand-edited lockfile, and this repo has already lost a day to a
      package-lock that npm regenerated differently. The script is what the
      package injects anyway.

      Served from /stats rather than /_vercel/insights, and reporting there too
      via data-endpoint. Blocklists match that path by name, and this is
      cookieless first-party analytics -- page views and referrers, no
      cross-site tracking and no personal data -- so the block is a heuristic
      about the URL rather than about what it does. Both have to move: leaving
      either on the old path leaves that half blocked.

      The script reads dataset.endpoint and appends the event name, so
      data-endpoint="/stats" sends to /stats/view, which the rewrite in
      vercel.json forwards. Undo by deleting data-endpoint and the two rewrites.

      Vercel serves it, so it is inert locally and on any other host -- no key,
      no account id, nothing to configure.
    -->
    <script defer src="/stats/script.js" data-endpoint="/stats"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

</html>
